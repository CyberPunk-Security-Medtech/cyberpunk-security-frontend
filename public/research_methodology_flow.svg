<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Materials and Methods: Hepatoprotective Study of Ipomoea cairica
  </text>
  
  <!-- Step 1: Plant Collection -->
  <rect x="50" y="60" width="900" height="80" fill="#e6f3ff" stroke="#2563eb" stroke-width="2" rx="5"/>
  <text x="500" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">
    STEP 1: PLANT COLLECTION
  </text>
  <text x="500" y="110" font-size="14" text-anchor="middle" fill="#333">
    Fresh Ipomoea cairica leaves harvested from Nembe LGA, Bayelsa State (Oct 8, 2021)
  </text>
  <text x="500" y="130" font-size="13" text-anchor="middle" fill="#666">
    Identified at University of Benin | Voucher: UBH-1561
  </text>
  
  <!-- Arrow -->
  <path d="M 500 140 L 500 160" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Animal Preparation -->
  <rect x="50" y="160" width="900" height="100" fill="#fff4e6" stroke="#ea580c" stroke-width="2" rx="5"/>
  <text x="500" y="185" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">
    STEP 2: ANIMAL PREPARATION
  </text>
  <text x="500" y="210" font-size="14" text-anchor="middle" fill="#333">
    35 male Wistar rats | 2 weeks acclimatization | Standard pellet feed + water ad libitum
  </text>
  <text x="500" y="235" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Randomly divided into 5 groups (n=7 each)
  </text>
  
  <!-- Arrow -->
  <path d="M 500 260 L 500 280" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Experimental Groups -->
  <rect x="50" y="280" width="900" height="280" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="500" y="305" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">
    STEP 3: EXPERIMENTAL GROUPS &amp; TREATMENT (14 days)
  </text>
  
  <!-- Group boxes -->
  <rect x="80" y="320" width="160" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="160" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">Group I</text>
  <text x="160" y="360" font-size="12" text-anchor="middle" fill="#333">CONTROL</text>
  <text x="160" y="385" font-size="11" text-anchor="middle" fill="#666">Distilled water</text>
  <text x="160" y="405" font-size="11" text-anchor="middle" fill="#666">only</text>
  
  <rect x="260" y="320" width="160" height="220" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="3"/>
  <text x="340" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">Group II</text>
  <text x="340" y="360" font-size="12" text-anchor="middle" fill="#333">ACETAMINOPHEN</text>
  <text x="340" y="385" font-size="11" text-anchor="middle" fill="#666">Single dose:</text>
  <text x="340" y="405" font-size="11" text-anchor="middle" fill="#666">2000 mg/kg</text>
  <text x="340" y="425" font-size="11" text-anchor="middle" fill="#666">ACET</text>
  
  <rect x="440" y="320" width="160" height="220" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="3"/>
  <text x="520" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Group III</text>
  <text x="520" y="360" font-size="12" text-anchor="middle" fill="#333">LOW DOSE</text>
  <text x="520" y="385" font-size="11" text-anchor="middle" fill="#666">100 mg/kg MEIC</text>
  <text x="520" y="405" font-size="11" text-anchor="middle" fill="#666">(14 days)</text>
  <text x="520" y="425" font-size="11" text-anchor="middle" fill="#666">+ ACET</text>
  <text x="520" y="445" font-size="11" text-anchor="middle" fill="#666">(single dose)</text>
  
  <rect x="620" y="320" width="160" height="220" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="3"/>
  <text x="700" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Group IV</text>
  <text x="700" y="360" font-size="12" text-anchor="middle" fill="#333">HIGH DOSE</text>
  <text x="700" y="385" font-size="11" text-anchor="middle" fill="#666">250 mg/kg MEIC</text>
  <text x="700" y="405" font-size="11" text-anchor="middle" fill="#666">(14 days)</text>
  <text x="700" y="425" font-size="11" text-anchor="middle" fill="#666">+ ACET</text>
  <text x="700" y="445" font-size="11" text-anchor="middle" fill="#666">(single dose)</text>
  
  <rect x="800" y="320" width="160" height="220" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" rx="3"/>
  <text x="880" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#3730a3">Group V</text>
  <text x="880" y="360" font-size="12" text-anchor="middle" fill="#333">EXTRACT ONLY</text>
  <text x="880" y="385" font-size="11" text-anchor="middle" fill="#666">250 mg/kg MEIC</text>
  <text x="880" y="405" font-size="11" text-anchor="middle" fill="#666">(14 days)</text>
  <text x="880" y="425" font-size="11" text-anchor="middle" fill="#666">No ACET</text>
  
  <!-- Arrow -->
  <path d="M 500 560 L 500 580" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Sacrifice -->
  <rect x="50" y="580" width="900" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="500" y="605" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">
    STEP 4: SACRIFICE &amp; SAMPLE COLLECTION
  </text>
  <text x="500" y="630" font-size="14" text-anchor="middle" fill="#333">
    24 hours after last administration | Mild anesthesia | Blood via cardiac puncture | Liver excised
  </text>
  
  <!-- Arrow -->
  <path d="M 500 650 L 500 670" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Analysis -->
  <rect x="50" y="670" width="900" height="200" fill="#fce7f3" stroke="#be185d" stroke-width="2" rx="5"/>
  <text x="500" y="695" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">
    STEP 5: BIOCHEMICAL ANALYSIS
  </text>
  
  <!-- Three columns of analysis -->
  <g>
    <!-- Blood/Serum Analysis -->
    <rect x="80" y="710" width="260" height="140" fill="#fff" stroke="#be185d" stroke-width="1" rx="3"/>
    <text x="210" y="730" font-size="13" font-weight="bold" text-anchor="middle" fill="#9f1239">SERUM MARKERS</text>
    <text x="210" y="755" font-size="11" text-anchor="middle" fill="#333">• Liver Function:</text>
    <text x="210" y="775" font-size="11" text-anchor="middle" fill="#666">AST, ALT, Albumin</text>
    <text x="210" y="800" font-size="11" text-anchor="middle" fill="#333">• Lipid Profile:</text>
    <text x="210" y="820" font-size="11" text-anchor="middle" fill="#666">TC, TG, HDL, LDL</text>
    
    <!-- Oxidative Stress -->
    <rect x="360" y="710" width="260" height="140" fill="#fff" stroke="#be185d" stroke-width="1" rx="3"/>
    <text x="490" y="730" font-size="13" font-weight="bold" text-anchor="middle" fill="#9f1239">OXIDATIVE STRESS</text>
    <text x="490" y="755" font-size="11" text-anchor="middle" fill="#666">• MDA, GSH, PC</text>
    <text x="490" y="775" font-size="11" text-anchor="middle" fill="#666">• SOD activity</text>
    <text x="490" y="795" font-size="11" text-anchor="middle" fill="#666">• CAT activity</text>
    <text x="490" y="815" font-size="11" text-anchor="middle" fill="#666">• GST activity</text>
    
    <!-- Inflammatory Markers -->
    <rect x="640" y="710" width="280" height="140" fill="#fff" stroke="#be185d" stroke-width="1" rx="3"/>
    <text x="780" y="730" font-size="13" font-weight="bold" text-anchor="middle" fill="#9f1239">INFLAMMATION</text>
    <text x="780" y="755" font-size="11" text-anchor="middle" fill="#666">• NADPH oxidase</text>
    <text x="780" y="775" font-size="11" text-anchor="middle" fill="#666">• Xanthine oxidase (XO)</text>
    <text x="780" y="795" font-size="11" text-anchor="middle" fill="#666">• Myeloperoxidase (MPO)</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 500 870 L 500 890" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Statistical Analysis -->
  <rect x="50" y="890" width="900" height="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="5"/>
  <text x="500" y="915" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">
    STEP 6: STATISTICAL ANALYSIS
  </text>
  <text x="500" y="940" font-size="14" text-anchor="middle" fill="#333">
    Data expressed as Mean ± SD (n=7) | Significance: *P&lt;0.05, **P&lt;0.0001, #P&lt;0.05, ##P&lt;0.001, ###P&lt;0.001
  </text>
  
  <!-- Legend -->
  <rect x="50" y="990" width="900" height="120" fill="#f8fafc" stroke="#64748b" stroke-width="1" rx="5"/>
  <text x="500" y="1015" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a365d">
    KEY ABBREVIATIONS
  </text>
  <text x="120" y="1040" font-size="12" text-anchor="start" fill="#333">
    • MEIC: Methanolic Extract of Ipomoea cairica
  </text>
  <text x="120" y="1060" font-size="12" text-anchor="start" fill="#333">
    • ACET: Acetaminophen (2000 mg/kg single dose)
  </text>
  <text x="120" y="1080" font-size="12" text-anchor="start" fill="#333">
    • MDA: Malondialdehyde | PC: Protein Carbonyl
  </text>
  <text x="550" y="1040" font-size="12" text-anchor="start" fill="#333">
    • GSH: Glutathione | SOD: Superoxide Dismutase
  </text>
  <text x="550" y="1060" font-size="12" text-anchor="start" fill="#333">
    • CAT: Catalase | GST: Glutathione-S-Transferase
  </text>
  <text x="550" y="1080" font-size="12" text-anchor="start" fill="#333">
    • TC: Total Cholesterol | TG: Triglyceride
  </text>
  
  <!-- Timeline indicator -->
  <rect x="50" y="1130" width="900" height="50" fill="#fef9e7" stroke="#f59e0b" stroke-width="2" rx="5"/>
  <text x="500" y="1160" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">
    📅 TOTAL STUDY DURATION: 2 weeks acclimatization + 14 days treatment + 24 hours post-treatment
  </text>
  
  <!-- Footer -->
  <text x="500" y="1220" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
    Study Location: Federal University Otuoke, Bayelsa State, Nigeria
  </text>
  <text x="500" y="1240" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
    Plant Voucher: UBH-1561 (University of Benin Herbarium)
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>
</svg>